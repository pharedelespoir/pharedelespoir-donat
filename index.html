<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordonnées Bancaires - PHARE DE L'ESPOIR</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            background: var(--card-bg);
            max-width: 540px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 28px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .content {
            padding: 24px;
        }

        .info-card {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .info-details {
            flex-grow: 1;
            overflow: hidden;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
            font-family: monospace, sans-serif;
        }

        .btn-copy {
            background-color: var(--card-bg);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.825rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-copy.copied {
            background-color: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-main {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: center;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
        }

        .btn-main.copied {
            background-color: var(--success) !important;
        }

        .footer-note {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 16px;
        }

        @media (max-width: 480px) {
            .info-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-copy {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>PHARE DE L'ESPOIR</h1>
        <p>Coordonnées Bancaires pour Virement</p>
    </div>

    <div class="content">
        <!-- Titulaire -->
        <div class="info-card">
            <div class="info-details">
                <div class="info-label">Bénéficiaire (Nom)</div>
                <div class="info-value" style="font-family: inherit;">PHARE DE L'ESPOIR</div>
            </div>
            <button class="btn-copy" data-copy="PHARE DE L'ESPOIR" onclick="copyText(this)">
                Copier
            </button>
        </div>

        <!-- IBAN -->
        <div class="info-card">
            <div class="info-details">
                <div class="info-label">IBAN</div>
                <div class="info-value">FR76 1009 6182 3200 0614 4930 239</div>
            </div>
            <button class="btn-copy" data-copy="FR7610096182320006144930239" onclick="copyText(this)">
                Copier
            </button>
        </div>

        <!-- BIC -->
        <div class="info-card">
            <div class="info-details">
                <div class="info-label">BIC / SWIFT</div>
                <div class="info-value">CMCIFRPP</div>
            </div>
            <button class="btn-copy" data-copy="CMCIFRPP" onclick="copyText(this)">
                Copier
            </button>
        </div>

        <!-- Motif / Raison -->
        <div class="info-card">
            <div class="info-details">
                <div class="info-label">Motif du virement</div>
                <div class="info-value" style="font-family: inherit;">DONATION</div>
            </div>
            <button class="btn-copy" data-copy="DONATION" onclick="copyText(this)">
                Copier
            </button>
        </div>

        <div class="actions">
            <button class="btn-main" id="copy-all-btn" onclick="copyAll()">
                Tout copier (RIB complet)
            </button>
        </div>

        <div class="footer-note">
            Cliquez sur un bouton pour copier l'information directement dans le presse-papier.
        </div>
    </div>
</div>

<script>
    function copyText(button) {
        const textToCopy = button.getAttribute('data-copy');
        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = button.innerHTML;
            button.innerHTML = 'Copié !';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.innerHTML = originalText;
                button.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            console.error('Erreur lors de la copie:', err);
        });
    }

    function copyAll() {
        const fullRib = `Bénéficiaire: PHARE DE L'ESPOIR\nIBAN: FR7610096182320006144930239\nBIC: CMCIFRPP\nMotif: DONATION`;
        const button = document.getElementById('copy-all-btn');
        
        navigator.clipboard.writeText(fullRib).then(() => {
            const originalText = button.innerHTML;
            button.innerHTML = 'Tout a été copié !';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.innerHTML = originalText;
                button.classList.remove('copied');
            }, 2000);
        });
    }
</script>

</body>
</html>
